app:
  name: port6
  environment: development

upload:
  directory: uploads
  max_file_size_bytes: 5242880
  max_files: 5

  allowed_types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/msword
    - text/plain
    - text/markdown

database:
  pool_pre_ping: true

parser:
  normalize_whitespace: true

chunking:
  chunk_size: 1000
  chunk_overlap: 200

embeddings:
  provider: openai
  model: text-embedding-3-small

vector:
  provider: chroma
  collection: documents
  persist_directory: chroma_data

llm:
  provider: openai
  model: gpt-5-mini
  temperature: 0.0

temporal:
  host: localhost:7233
  namespace: default
  task_queue: port6-document-processing

vector:
  provider: chroma
  persist_directory: chroma_data
  collection_name: port6_documents