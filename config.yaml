app:
  name: port6
  environment: development


# Deploy-time facts. Runtime tuning (chunk size, retrieval thresholds,
# summary limits, agent behaviour) lives in the `settings` table and is
# changed through the API; everything about which model to call lives in
# .env. Only values needed before the database is reachable belong here.
upload:
  directory: uploads
  max_file_size_bytes: 5242880
  max_files: 5
  allowed_types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/msword
    - text/plain
    - text/markdown


database:
  pool_pre_ping: true


parser:
  normalize_whitespace: true


vector:
  provider: chroma
  persist_directory: chroma_data
  collection_name: port6_documents
