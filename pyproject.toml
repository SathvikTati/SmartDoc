[project]
name = "port6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SathvikTati", email = "sathvik.tati@calfus.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "markdown>=3.10.3",
    "openai>=2.53.0",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
port6 = "port6:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
