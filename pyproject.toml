[project]
name = "port6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SathvikTati", email = "sathvik.tati@calfus.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "markdown>=3.10.3",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
port6 = "port6:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
